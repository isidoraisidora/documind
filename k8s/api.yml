apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: documind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: documind-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8010
          envFrom:
            - configMapRef:
                name: documind-config
            - secretRef:
                name: documind-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 30
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: documind
spec:
  selector:
    app: api
  ports:
    - port: 8010